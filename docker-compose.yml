services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incident-pipeline-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./service-account-key.json:/app/service-account-key.json:ro
      - ./backend/exports:/app/exports
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account-key.json
    restart: always

  # React Frontend (production build served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incident-pipeline-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

  # Nginx Reverse Proxy (for production deployment on Azure VM)
  nginx:
    image: nginx:alpine
    container_name: incident-pipeline-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always
